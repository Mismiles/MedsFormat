<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Medication Formatter</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">

<style>
body{
    background:#f8f9fa;
    padding:20px;
}



.result-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px;
    margin-bottom: 8px;
    background: white;
    border: 1px solid #dee2e6;
    border-radius: 6px;
}

.edit-area {
    resize: none;
    overflow: hidden;
    min-height: 32px;
    width: 100%;
}

.medication-container {
    align-items: flex-start !important;
}

  
.delete-btn {
    flex-shrink: 0;
}

.medication-container {
    flex-grow: 1;
    min-width: 0;
}

.medication {
    white-space: normal;
    word-wrap: break-word;
    overflow-wrap: break-word;
    flex: 1;
}

.medication:hover {
    background-color: #f8f9fa;
}

.tick {
    width: 24px;
    text-align: center;
}

.btn-group {
    white-space: nowrap;
}

</style>
</head>
<body>

  <div id="confirmContainer" class="container mt-5">

    <div class="card shadow">
        <div class="card-body text-center">

            <h3 class="mb-4">Safety Confirmation</h3>

            <p class="lead">
                I confirm that I will not input any confidential data into this website.
            </p>

            <button class="btn btn-success btn-lg"
                    onclick="confirmSafety()">
                Confirm
            </button>

        </div>
    </div>
</div>


  <div id="appContainer" style="display:none;">

      <div class="btn-group mb-3 w-100">

    <button id="gpTab"
            class="btn btn-success"
            onclick="showPage('gp')">
        From Real Time GP Record
    </button>

    <button id="summaryTab"
            class="btn btn-primary"
            onclick="showPage('summary')">
        From Medication Summary
    </button>
</div>
    <!-- Real Time GP Record formatter -->
    <div id="gpPage">

    <h3 class="mb-3">From Real Time GP Record</h3>

    <div class="mb-3">
        <label class="form-label fw-bold">
            Acute Medication
        </label>

        <textarea id="acuteData"
                  class="form-control"
                  rows="3"
                  placeholder="Paste medication data here"></textarea>
    </div>

    <div class="mb-3">
        <label class="form-label fw-bold">
            Current Repeat Medication
        </label>

        <textarea id="repeatData"
                  class="form-control"
                  rows="3"
                  placeholder="Paste medication data here"></textarea>
    </div>

    <button class="btn btn-success mb-3"
            onclick="formatGPData()">
        Format Both Boxes
    </button>

    <div class="accordion mt-4" id="gpResultsAccordion">

    <div class="accordion-item">
        <h2 class="accordion-header">
            <button class="accordion-button"
        type="button"
        data-bs-toggle="collapse"
        data-bs-target="#acuteResults">

    Acute Medication Results

    <span id="acuteCount"
          class="badge bg-success ms-2">
        0
    </span>
</button>
        </h2>

        <div id="acuteResults"
             class="accordion-collapse collapse show">
            <div class="accordion-body">
                <div id="acuteOutput"></div>
            </div>
        </div>
    </div>

    <div class="accordion-item">
        <h2 class="accordion-header">
            <button class="accordion-button"
        type="button"
        data-bs-toggle="collapse"
        data-bs-target="#repeatResults">

    Current Repeat Medication Results

    <span id="repeatCount"
          class="badge bg-primary ms-2">
        0
    </span>
</button>
        </h2>

        <div id="repeatResults"
           class="accordion-collapse collapse show">
            <div class="accordion-body">
                <div id="repeatOutput"></div>
            </div>
        </div>
<div class="accordion-item">

    <h2 class="accordion-header">

        <button class="accordion-button collapsed"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#deletedResults">

            Deleted Items

            <span id="deletedCount"
                  class="badge bg-danger ms-2">
                0
            </span>

        </button>

    </h2>

    <div id="deletedResults"
         class="accordion-collapse collapse">

        <div class="accordion-body">

            <div class="accordion mb-3">

                <!-- Deleted Acute -->
                <div class="accordion-item">

                    <h2 class="accordion-header">

                        <button class="accordion-button collapsed"
                                type="button"
                                data-bs-toggle="collapse"
                                data-bs-target="#deletedAcuteResults">

                            Deleted Acute

                            <span id="deletedAcuteCount"
                                  class="badge bg-warning text-dark ms-2">
                                0
                            </span>

                        </button>

                    </h2>

                    <div id="deletedAcuteResults"
                         class="accordion-collapse collapse">

                        <div class="accordion-body">
                            <div id="deletedAcuteOutput"></div>
                        </div>

                    </div>

                </div>

                <!-- Deleted Repeat -->
                <div class="accordion-item">

                    <h2 class="accordion-header">

                        <button class="accordion-button collapsed"
                                type="button"
                                data-bs-toggle="collapse"
                                data-bs-target="#deletedRepeatResults">

                            Deleted Repeat

                            <span id="deletedRepeatCount"
                                  class="badge bg-warning text-dark ms-2">
                                0
                            </span>

                        </button>

                    </h2>

                    <div id="deletedRepeatResults"
                         class="accordion-collapse collapse">

                        <div class="accordion-body">
                            <div id="deletedRepeatOutput"></div>
                        </div>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>
      
    </div>

</div>

</div>

<div id="summaryPage" style="display:none;">
    <!-- Existing Medication Summary formatter -->
  
<div class="container">
    <h2 class="mb-3">Medication Formatter</h2>

    <textarea id="rawData" class="form-control mb-3" rows="7"
        placeholder="Paste medication data here"></textarea>

    <button class="btn btn-primary mb-3" onclick="formatMeds()">
        Format Medications
    </button>

    <div id="output"></div>
</div>
    </div>
</div>

  
    
<script>

let acuteMedications = [];
let repeatMedications = [];

let deletedAcuteMedications = [];
let deletedRepeatMedications = [];

function confirmSafety() {

    const confirmContainer =
        document.getElementById("confirmContainer");

    const appContainer =
        document.getElementById("appContainer");

    console.log("confirmContainer =", confirmContainer);
    console.log("appContainer =", appContainer);

    if (confirmContainer)
        confirmContainer.style.display = "none";

    if (appContainer)
        appContainer.style.display = "block";

    showPage("gp");
}

function showPage(page){

    const gpPage =
        document.getElementById("gpPage");

    const summaryPage =
        document.getElementById("summaryPage");

    console.log("gpPage =", gpPage);
    console.log("summaryPage =", summaryPage);

    if (!gpPage || !summaryPage) {
        console.error("Missing page element");
        return;
    }

    if (page === "gp") {

        gpPage.style.display = "block";
        summaryPage.style.display = "none";

    } else {

        gpPage.style.display = "none";
        summaryPage.style.display = "block";

    }
}

function copyText(text, button){
    navigator.clipboard.writeText(text);

    const original = button.innerText;
    button.innerText = "Copied";

    setTimeout(()=>{
        button.innerText = original;
    },1000);
}

function formatMeds(){

    const output = document.getElementById("output");
    output.innerHTML = "";

    let text = document.getElementById("rawData").value;

    // Remove HTML tags
    text = text.replace(/<[^>]*>/g,'');

    let lines = text
        .split(/\r?\n/)
        .map(x => x.trim())
        .filter(x => x !== "");

    const medications = [];

    const ignorePatterns = [
        /^LATEST$/i,
        /^FIRST$/i,
        /^GP Issued$/i,
        /^\d+\s*Items$/i,
        /^$/,
        /^$/,
        /^$/,
        /^$/,
        /^\d+\s*-\s*\d+\s*of\s*\d+$/i
    ];

    function shouldIgnore(line){
        return ignorePatterns.some(p => p.test(line));
    }

    function isDate(line){
        return /^\d{1,2}-[A-Za-z]{3}-\d{4}$/.test(line);
    }

    function isDirection(line){
        return /\(.+\)$/.test(line);
    }

    for(let i=0;i<lines.length;i++){

        let line = lines[i];

        if(shouldIgnore(line)) continue;

        if(isDirection(line)){

            let direction = line
                .replace(/\s*\([^)]*\)\s*$/,'')
                .trim();

            let medication = "";

            let j = i - 1;

            while(j >= 0){

                if(
                    shouldIgnore(lines[j]) ||
                    isDate(lines[j])
                ){
                    j--;
                    continue;
                }

                medication = lines[j];
                break;
            }

            if(medication){
                medications.push(
                    medication + " " + direction
                );
            }
        }
    }

    medications.forEach(med => {

    const row = document.createElement("div");
    row.className = "result-row";

row.innerHTML = `
    <button class="btn btn-danger btn-sm delete-btn me-2">
        Delete
    </button>

    <div class="d-flex align-items-center flex-grow-1 medication-container">

        <span class="tick me-2"
              style="display:none;color:#198754;font-size:1.4rem;">
            ✅
        </span>

        <div class="medication flex-grow-1"
             style="cursor:pointer;"
             title="Click to edit">
            ${med}
        </div>

    </div>

    <div class="ms-2">

        <button class="btn btn-primary btn-sm confirm-btn d-none">
            Confirm
        </button>

        <button class="btn btn-success btn-sm copy-btn">
            Copy
        </button>

    </div>
`;

    const medicationDiv = row.querySelector(".medication");
    const confirmBtn = row.querySelector(".confirm-btn");
    const copyBtn = row.querySelector(".copy-btn");
    const deleteBtn = row.querySelector(".delete-btn");
    const tick = row.querySelector(".tick");

    let editing = false;

    // CLICK TEXT TO EDIT
    medicationDiv.addEventListener("click", () => {

        if (editing) return;

        tick.style.display = "none";

        const currentText = medicationDiv.textContent.trim();


        medicationDiv.innerHTML = `
    <textarea
        class="form-control form-control-sm edit-area"
        rows="3">${currentText.replace(/"/g,'&quot;')}</textarea>
`;

        copyBtn.classList.add("d-none");
        confirmBtn.classList.remove("d-none");

        editing = true;
    });

    // CONFIRM EDIT
    confirmBtn.addEventListener("click", () => {

        const newText =
            medicationDiv.querySelector("textarea").value.trim();

        medicationDiv.textContent = newText;

        confirmBtn.classList.add("d-none");
        copyBtn.classList.remove("d-none");

        editing = false;
    });

    // COPY
    copyBtn.addEventListener("click", () => {

        const text = medicationDiv.textContent.trim();

        navigator.clipboard.writeText(text);

        tick.style.display = "inline";

        const original = copyBtn.textContent;

        copyBtn.textContent = "Copied";

        setTimeout(() => {
            copyBtn.textContent = original;
        }, 1000);

    });

    // DELETE
    deleteBtn.addEventListener("click", () => {

        row.remove();

    });

    output.appendChild(row);

});

}

function formatGPData(){

    const acuteText =
        document.getElementById("acuteData").value;

    const repeatText =
        document.getElementById("repeatData").value;

    const acuteMeds =
        processGPSection(acuteText);

    const repeatMeds =
        processGPSection(repeatText);

    renderMedicationRows(
        acuteMeds,
        "acuteOutput"
    );

    renderMedicationRows(
        repeatMeds,
        "repeatOutput"
    );

    document.getElementById("acuteCount").textContent =
        acuteMeds.length;

    document.getElementById("repeatCount").textContent =
        repeatMeds.length;

    new bootstrap.Collapse(
        document.getElementById("acuteResults"),
        { toggle: false }
    ).show();

    new bootstrap.Collapse(
        document.getElementById("repeatResults"),
        { toggle: false }
    ).show();

    acuteMedications = processGPSection(
        document.getElementById("acuteData").value
    );

    repeatMedications = processGPSection(
        document.getElementById("repeatData").value
    );

    deletedAcuteMedications = [];
    deletedRepeatMedications = [];

    refreshAllOutputs();

}

function renderMedicationRows(medications, outputId, type){

    const output = document.getElementById(outputId);

    if(!output){
        console.error("Output container not found:", outputId);
        return;
    }

    output.innerHTML = "";

    medications.forEach(med => {

        const row = document.createElement("div");
        row.className = "result-row";

        row.innerHTML = `
            <button class="btn btn-danger btn-sm delete-btn me-2">
                Delete
            </button>

            <div class="d-flex align-items-center flex-grow-1 medication-container">

                <span class="tick me-2"
                      style="display:none;color:#198754;font-size:1.4rem;">
                    ✅
                </span>

                <div class="medication flex-grow-1"
                     style="cursor:pointer;"
                     title="Click to edit">
                    ${med}
                </div>

            </div>

            <div class="ms-2">

                <button class="btn btn-primary btn-sm confirm-btn d-none">
                    Confirm
                </button>

                <button class="btn btn-success btn-sm copy-btn">
                    Copy
                </button>

            </div>
        `;

        const medicationDiv = row.querySelector(".medication");
        const confirmBtn = row.querySelector(".confirm-btn");
        const copyBtn = row.querySelector(".copy-btn");
        const deleteBtn = row.querySelector(".delete-btn");
        const tick = row.querySelector(".tick");

        let editing = false;

        // Click text to edit
        medicationDiv.addEventListener("click", () => {

            if(editing) return;

            tick.style.display = "none";

            const currentText = medicationDiv.textContent.trim();

            medicationDiv.innerHTML = `
                <textarea
                    class="form-control form-control-sm edit-area"
                    rows="1">${currentText}</textarea>
            `;

            const textarea =
                medicationDiv.querySelector(".edit-area");

            textarea.style.height = "auto";
            textarea.style.height =
                textarea.scrollHeight + "px";

            textarea.addEventListener("input", function(){

                this.style.height = "auto";
                this.style.height =
                    this.scrollHeight + "px";

            });

            copyBtn.classList.add("d-none");
            confirmBtn.classList.remove("d-none");

            editing = true;
        });

        // Confirm edit
        confirmBtn.addEventListener("click", () => {

            const textarea =
                medicationDiv.querySelector(".edit-area");

            const newText =
                textarea.value.trim();

            medicationDiv.textContent = newText;

            confirmBtn.classList.add("d-none");
            copyBtn.classList.remove("d-none");

            editing = false;
        });

        // Copy
        copyBtn.addEventListener("click", () => {

            const text =
                medicationDiv.textContent.trim();

            navigator.clipboard.writeText(text);

            tick.style.display = "inline";

            const original = copyBtn.textContent;

            copyBtn.textContent = "Copied";

            setTimeout(() => {
                copyBtn.textContent = original;
            }, 1000);

        });

        // Delete
        deleteBtn.addEventListener("click", () => {

    if(type === "acute"){

    const index = acuteMedications.indexOf(med);

    if(index > -1){

        deletedAcuteMedications.push({
            text: med,
            originalIndex: index
        });

        acuteMedications.splice(index, 1);

    }

}
else{

    const index = repeatMedications.indexOf(med);

    if(index > -1){

        deletedRepeatMedications.push({
            text: med,
            originalIndex: index
        });

        repeatMedications.splice(index, 1);

    }

}

    refreshAllOutputs();
});

              output.appendChild(row);

    });

}

function processGPSection(text) {

    const medications = [];

    const rows = text
        .split(/\r?\n/)
        .map(x => x.trim())
        .filter(x => x);

    rows.forEach(row => {

        const cols = row
            .split(/\t+/)
            .map(x => x.trim());

        if (cols.length < 4) return;

        const recordType = cols[0]
    .toUpperCase()
    .trim();

if (
    !recordType.startsWith("ACUTE") &&
    !recordType.startsWith("REPEAT")
){
    return;
}

        const medication = cols[2];
        const direction = cols[3];

        if (!medication || !direction) return;

        medications.push(
            `${medication} ${direction}`
        );

    });

    return medications;
}

function refreshAllOutputs(){

    renderMedicationRows(
        acuteMedications,
        "acuteOutput",
        "acute"
    );

    renderMedicationRows(
        repeatMedications,
        "repeatOutput",
        "repeat"
    );

    renderDeletedRows(
        deletedAcuteMedications,
        "deletedAcuteOutput",
        "acute"
    );

    renderDeletedRows(
        deletedRepeatMedications,
        "deletedRepeatOutput",
        "repeat"
    );

    updateCounts();

}


function updateCounts(){

    document.getElementById("acuteCount")
        .textContent = acuteMedications.length;

    document.getElementById("repeatCount")
        .textContent = repeatMedications.length;

    document.getElementById("deletedAcuteCount")
        .textContent = deletedAcuteMedications.length;

    document.getElementById("deletedRepeatCount")
        .textContent = deletedRepeatMedications.length;

    document.getElementById("deletedCount")
        .textContent =
            deletedAcuteMedications.length +
            deletedRepeatMedications.length;

}

function renderDeletedRows(medications,outputId,type){

    const output =
        document.getElementById(outputId);

    output.innerHTML = "";

    medications.forEach(med => {

        const row =
            document.createElement("div");

        row.className =
            "result-row";

        row.innerHTML = `

            <button class="btn btn-secondary btn-sm undo-btn">
                Undo Delete
            </button>

            <div class="flex-grow-1 ms-2">
                ${med.text}
            </div>

        `;

        row.querySelector(".undo-btn")
            .addEventListener("click", () => {

                if(type === "acute"){

                    deletedAcuteMedications =
                        deletedAcuteMedications
                        .filter(x => x !== med);

                    acuteMedications.splice(med.
                                            originalIndex,
                                            0,med.text
                    );

                }
                else{

                    deletedRepeatMedications =
                        deletedRepeatMedications
                        .filter(x => x !== med);

                    repeatMedications.splice(med.
                                             originalIndex,
                                             0,med.text
                    );

                }

                refreshAllOutputs();

            });

        output.appendChild(row);

    });
}

      


      </script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
