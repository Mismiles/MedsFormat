<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Medication Formatter</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">

<style>
body{
    background:#f8f9fa;
    padding:20px;
}

.result-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    padding:10px;
    margin-bottom:8px;
    background:#fff;
    border:1px solid #ddd;
    border-radius:6px;
}

.medication{
    flex:1;
    word-break:break-word;
}
</style>
</head>
<body>

  <div id="confirmContainer" class="container mt-5">

    <div class="card shadow">
        <div class="card-body text-center">

            <h3 class="mb-4">Safety Confirmation</h3>

            <p class="lead">
                I confirm that I will not input any confidential data into this website.
            </p>

            <button class="btn btn-success btn-lg"
                    onclick="confirmSafety()">
                Confirm
            </button>

        </div>
    </div>

</div>

  <div id="appContainer" style="display:none;">
  
<div class="container">
    <h2 class="mb-3">Medication Formatter</h2>

    <textarea id="rawData" class="form-control mb-3" rows="15"
        placeholder="Paste medication data here"></textarea>

    <button class="btn btn-primary mb-3" onclick="formatMeds()">
        Format Medications
    </button>

    <div id="output"></div>
</div>
    </div>
    
<script>

function confirmSafety() {

    document.getElementById("confirmContainer").style.display = "none";
    document.getElementById("appContainer").style.display = "block";

}


function copyText(text, button){
    navigator.clipboard.writeText(text);

    const original = button.innerText;
    button.innerText = "Copied";

    setTimeout(()=>{
        button.innerText = original;
    },1000);
}

function formatMeds(){

    const output = document.getElementById("output");
    output.innerHTML = "";

    let text = document.getElementById("rawData").value;

    // Remove HTML tags
    text = text.replace(/<[^>]*>/g,'');

    let lines = text
        .split(/\r?\n/)
        .map(x => x.trim())
        .filter(x => x !== "");

    const medications = [];

    const ignorePatterns = [
        /^LATEST$/i,
        /^FIRST$/i,
        /^GP Issued$/i,
        /^\d+\s*Items$/i,
        /^$/,
        /^$/,
        /^$/,
        /^$/,
        /^\d+\s*-\s*\d+\s*of\s*\d+$/i
    ];

    function shouldIgnore(line){
        return ignorePatterns.some(p => p.test(line));
    }

    function isDate(line){
        return /^\d{1,2}-[A-Za-z]{3}-\d{4}$/.test(line);
    }

    function isDirection(line){
        return /\(.+\)$/.test(line);
    }

    for(let i=0;i<lines.length;i++){

        let line = lines[i];

        if(shouldIgnore(line)) continue;

        if(isDirection(line)){

            let direction = line
                .replace(/\s*\([^)]*\)\s*$/,'')
                .trim();

            let medication = "";

            let j = i - 1;

            while(j >= 0){

                if(
                    shouldIgnore(lines[j]) ||
                    isDate(lines[j])
                ){
                    j--;
                    continue;
                }

                medication = lines[j];
                break;
            }

            if(medication){
                medications.push(
                    medication + " " + direction
                );
            }
        }
    }

    medications.forEach(med => {

    const row = document.createElement("div");
    row.className = "result-row";

    row.innerHTML = `
        <div class="d-flex align-items-center flex-grow-1">
            <span class="tick me-2"
                  style="display:none;color:#198754;font-size:1.4rem;">
                ✅
            </span>

            <div class="medication">${med}</div>
        </div>

        <div class="btn-group">
            <button class="btn btn-warning btn-sm edit-btn">
                Edit
            </button>

            <button class="btn btn-success btn-sm copy-btn">
                Copy
            </button>
        </div>
    `;

    const medicationDiv = row.querySelector(".medication");
    const copyBtn = row.querySelector(".copy-btn");
    const editBtn = row.querySelector(".edit-btn");
    const tick = row.querySelector(".tick");

    let editing = false;

    // COPY BUTTON
    copyBtn.addEventListener("click", () => {

        let currentText;

        if(editing){
            currentText = medicationDiv.querySelector("input").value;
        } else {
            currentText = medicationDiv.textContent;
        }

        navigator.clipboard.writeText(currentText);

        tick.style.display = "inline";

        const original = copyBtn.innerText;
        copyBtn.innerText = "Copied";

        setTimeout(() => {
            copyBtn.innerText = original;
        }, 1000);
    });

    // EDIT / CONFIRM BUTTON
    editBtn.addEventListener("click", () => {

    // Reset tick when editing starts
    tick.style.display = "none";

    if (!editing) {

        const currentText = medicationDiv.textContent.trim();

        medicationDiv.innerHTML = `
            <input
                type="text"
                class="form-control form-control-sm"
                value="${currentText.replace(/"/g, '&quot;')}"
            >
        `;

        editBtn.textContent = "Confirm";
        editBtn.classList.remove("btn-warning");
        editBtn.classList.add("btn-primary");

        // Hide Copy button while editing
        copyBtn.style.display = "none";

        editing = true;

    } else {

        const newText = medicationDiv.querySelector("input").value;

        medicationDiv.textContent = newText;

        editBtn.textContent = "Edit";
        editBtn.classList.remove("btn-primary");
        editBtn.classList.add("btn-warning");

        // Show Copy button again
        copyBtn.style.display = "inline-block";

        editing = false;
    }

});
``

    output.appendChild(row);

});

}

</script>

</body>
</html>
